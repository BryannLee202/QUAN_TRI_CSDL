services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartmushroom-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartmushroom-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        run() { /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -I -f 65001 "$$@"; }
        EXISTS=$$(run -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SmartMushroomDB'" | tr -d '[:space:]')
        if [ "$$EXISTS" = "1" ]; then echo "SmartMushroomDB da ton tai, bo qua nap."; exit 0; fi
        for f in 01_schema 02_tsql_logic 03_seed_data 04_indexing_and_performance; do
          echo ">>> Chay $$f.sql"
          run -i /scripts/$${f}.sql || exit 1
        done
        echo ">>> Nap CSDL xong."

volumes:
  sqldata: