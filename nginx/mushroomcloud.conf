# Cấu hình Nginx Reverse Proxy Production cho Hệ Thống MushroomCloud
# Đường dẫn cài đặt đề xuất trên VPS Linux (Ubuntu / Debian):
# /etc/nginx/sites-available/mushroomcloud.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/mushroomcloud.conf /etc/nginx/sites-enabled/
# Kiểm tra: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name mushroomcloud.vn www.mushroomcloud.vn; # Thay bằng IP hoặc Domain thật

    # Kích hoạt nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # 1. Reverse Proxy cho Backend REST API (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Reverse Proxy cho Swagger Docs
    location /api-docs {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Reverse Proxy cho WebSocket Realtime (Socket.io)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Reverse Proxy cho Next.js Frontend (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 5. Caching tài nguyên tĩnh
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
